name: Stage NASA 3D models

on:
  push:
    branches:
      - feature/3d-model-assets
    paths:
      - ".github/workflows/stage-nasa-models.yml"
      - "scripts/download-nasa-models.mjs"
      - "docs/AI_STUDIO_MODEL_IMPORT.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out model branch
        uses: actions/checkout@v4
        with:
          ref: feature/3d-model-assets
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download and validate official NASA GLBs
        run: node scripts/download-nasa-models.mjs

      - name: Commit downloaded models
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models/insight-cruise-lander-arm-deployed.glb public/models/ingenuity-mars-helicopter.glb public/models/perseverance-mars-2020.glb
          if git diff --cached --quiet; then
            echo "No new model files to commit."
          else
            git commit -m "Add official NASA InSight, Ingenuity and Perseverance GLBs"
            git push origin HEAD:feature/3d-model-assets
          fi
